databaseChangeLog:
  - changeSet:
      id: 008-create-notifications-table
      author: openai
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: user_id
            constraintName: fk_notifications_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_notifications_user_created_at
            tableName: notifications
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at

        - createIndex:
            indexName: idx_notifications_user_is_read
            tableName: notifications
            columns:
              - column:
                  name: user_id
              - column:
                  name: is_read