spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:user-db}:${DB_PORT:5432}/users_db
    username: ${DB_USERNAME:${DB_USER:postgres}}
    password: ${DB_PASSWORD:${DB_PASS:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000

  liquibase:
    change-log: classpath:liquibase/changelog-master.yml
    enabled: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVER:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: notif-group
      properties:
        spring.json.trusted.packages: "com.example.userms.dto"

server:
  port: 8082

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    webhook:
     secret: ${TELEGRAM_WEBHOOK_SECRET:}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  logging:
    minimum-breadcrumb-level: info
    minimum-event-level: error

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${SECRET_KEY:}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  telegram:
    connect-code-ttl-minutes: ${TELEGRAM_CONNECT_CODE_TTL_MINUTES:10}
  auth:
    refresh-cookie-name: ${APP_REFRESH_COOKIE_NAME:refreshToken}
    refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Strict}

logging:
  level:
    root: INFO
    com.example.userms: INFO
    org.springframework.security: WARN