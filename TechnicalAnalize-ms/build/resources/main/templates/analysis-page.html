
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <title>SMC & ICT Analysis Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .chart-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-telegram { background-color: #0088cc; color: white; }
    </style>
</head>
<body>
<div class="container-fluid py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Technical Analysis Engine</h1>
        <p class="text-muted">JFreeChart + Smart Money Concepts (SMC) Visualizer</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-4 text-center">
            <form action="/analysis/dashboard" method="get" class="input-group mb-3">
                <input type="text" name="symbol" class="form-control" placeholder="BTCUSDT, ETHUSDT..." required>
                <button class="btn btn-dark" type="submit">Analiz Et</button>
            </form>
        </div>
    </div>

    <div th:if="${chart}" class="row justify-content-center mt-4">
        <div class="col-lg-10">
            <div class="chart-container text-center">
                <h3 class="mb-4" th:text="${symbol} + ' H1 Chart Analysis'"></h3>

                <img th:src="'data:image/png;base64,' + ${chart}" class="img-fluid rounded mb-4" alt="Analysis">

                <form action="/analysis/send-telegram" method="post">
                    <input type="hidden" name="symbol" th:value="${symbol}">
                    <input type="hidden" name="base64Image" th:value="${chart}">
                    <button type="submit" class="btn btn-telegram btn-lg px-5">
                        <i class="fab fa-telegram"></i> Telegram-a Göndər
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
