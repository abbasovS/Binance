services:
  user-db:
    image: postgres:16-alpine
    env_file:
      - ./User-ms/.env
    environment:
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  price-db:
    image: postgres:16-alpine
    env_file:
      - ./Price-ms/.env
    ports:
      - "5432:5432"
    volumes:
      - price_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  trade-db:
    image: postgres:16-alpine
    env_file:
      - ./Trade-ms/.env
    ports:
      - "5434:5432"
    volumes:
      - trade_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  news-db:
    image: postgres:16-alpine
    env_file:
      - ./News-ms/.env
    ports:
      - "5435:5432"
    volumes:
      - news_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  user-ms:
    build:
      context: ./User-ms
    env_file:
      - ./User-ms/.env
    environment:
      SECRET_KEY: R2VtaW5pZGlyQnVHdW5IYXZhQ294R296ZWxkaXIxMjM0NTY3ODkwMTIz
    depends_on:
      - user-db
      - kafka
    ports:
      - "8082:8082"
    networks:
      - app-network

  price-ms:
    build:
      context: ./Price-ms
    env_file:
      - ./Price-ms/.env
    environment:
      SECRET_KEY: R2VtaW5pZGlyQnVHdW5IYXZhQ294R296ZWxkaXIxMjM0NTY3ODkwMTIz
      INTERNAL_API_KEY: super-secret-internal-key
    depends_on:
      - price-db
      - redis
    ports:
      - "8083:8083"
    networks:
      - app-network

  trade-ms:
    build:
      context: ./Trade-ms
    env_file:
      - ./Trade-ms/.env
    environment:
      SECRET_KEY: R2VtaW5pZGlyQnVHdW5IYXZhQ294R296ZWxkaXIxMjM0NTY3ODkwMTIz
      PRICE_MS_URL: http://price-ms:8083
    depends_on:
      - trade-db
      - kafka
      - redis
    ports:
      - "8085:8085"
    networks:
      - app-network

  news-ms:
    build:
      context: ./News-ms
    env_file:
      - ./News-ms/.env
    environment:
      SECRET_KEY: R2VtaW5pZGlyQnVHdW5IYXZhQ294R296ZWxkaXIxMjM0NTY3ODkwMTIz
      PRICE_SERVICE_URL: http://price-ms:8083
      USER_SERVICE_URL: http://user-ms:8082
    depends_on:
      - news-db
      - user-ms
      - price-ms
    ports:
      - "8081:8081"
    networks:
      - app-network

  technical-ms:
    build:
      context: ./TechnicalAnalize-ms
    env_file:
      - ./TechnicalAnalize-ms/.env
    environment:
      SECRET_KEY: R2VtaW5pZGlyQnVHdW5IYXZhQ294R296ZWxkaXIxMjM0NTY3ODkwMTIz
    depends_on:
      - user-ms
    ports:
      - "8086:8086"
    networks:
      - app-network

  api-gateway:
    build:
      context: ./api-gateway
    env_file:
      - ./api-gateway/.env
    depends_on:
      - user-ms
      - trade-ms
      - price-ms
      - news-ms
      - technical-ms
      - redis
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./User-ms/frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    networks:
      - app-network

volumes:
  user_db_data:
  price_db_data:
  trade_db_data:
  news_db_data:
  redis_data:

networks:
  app-network:
    driver: bridge