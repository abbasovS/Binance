databaseChangeLog:
  - changeSet:
      id: 20231218-1
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: watchlist
      changes:
        - createTable:
            tableName: watchlist
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 20231218-2
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: alerts_price
      changes:
        - createTable:
            tableName: alerts_price
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: target_price
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: side
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: is_triggered
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false