databaseChangeLog:
  - changeSet:
      id: 20260410-1-add-chat-id-to-alerts
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: alerts_price
        - not:
            columnExists:
              tableName: alerts_price
              columnName: chat_id
      changes:
        - addColumn:
            tableName: alerts_price
            columns:
              - column:
                  name: chat_id
                  type: VARCHAR(100)
                  defaultValue: pending
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260410-2-add-watchlist-unique-constraint
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: watchlist
        - not:
            uniqueConstraintExists:
              tableName: watchlist
              constraintName: uk_watchlist_symbol_user
      changes:
        - addUniqueConstraint:
            tableName: watchlist
            columnNames: symbol, user_email
            constraintName: uk_watchlist_symbol_user

  - changeSet:
      id: 20260410-3-add-watchlist-indexes-user
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: watchlist
        - not:
            indexExists:
              tableName: watchlist
              indexName: idx_watchlist_user_email
      changes:
        - createIndex:
            tableName: watchlist
            indexName: idx_watchlist_user_email
            columns:
              - column:
                  name: user_email

  - changeSet:
      id: 20260410-3-add-watchlist-indexes-symbol
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: watchlist
        - not:
            indexExists:
              tableName: watchlist
              indexName: idx_watchlist_symbol
      changes:
        - createIndex:
            tableName: watchlist
            indexName: idx_watchlist_symbol
            columns:
              - column:
                  name: symbol

  - changeSet:
      id: 20260410-4-add-alert-indexes-user
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: alerts_price
        - not:
            indexExists:
              tableName: alerts_price
              indexName: idx_alerts_user_email
      changes:
        - createIndex:
            tableName: alerts_price
            indexName: idx_alerts_user_email
            columns:
              - column:
                  name: user_email

  - changeSet:
      id: 20260410-4-add-alert-indexes-symbol
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: alerts_price
        - not:
            indexExists:
              tableName: alerts_price
              indexName: idx_alerts_symbol
      changes:
        - createIndex:
            tableName: alerts_price
            indexName: idx_alerts_symbol
            columns:
              - column:
                  name: symbol

  - changeSet:
      id: 20260410-4-add-alert-indexes-triggered
      author: senan
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: alerts_price
        - not:
            indexExists:
              tableName: alerts_price
              indexName: idx_alerts_triggered
      changes:
        - createIndex:
            tableName: alerts_price
            indexName: idx_alerts_triggered
            columns:
              - column:
                  name: is_triggered